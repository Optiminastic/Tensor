<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" role="img" aria-label="Bed-class escalation: a job starts on the smallest printer class and moves up only when a part does not fit">
  <style>
    .w { fill: none; stroke: #fff; stroke-opacity: .35; stroke-width: 1.5 }
    .t { font: 500 10px ui-monospace, Menlo, monospace; fill: #fff; fill-opacity: .7 }
    .u { animation: up 6s ease-in-out infinite }
    @keyframes up { 0%, 20% { transform: translate(0, 0) } 35%, 55% { transform: translate(100px, -7px) } 70%, 100% { transform: translate(206px, -14px) } }
    @media (prefers-reduced-motion: reduce) { .u { animation: none } }
  </style>
  <rect class="w" x="14" y="70" width="64" height="40" rx="5"/><text class="t" x="34" y="62">P2S</text>
  <rect class="w" x="112" y="56" width="78" height="54" rx="5"/><text class="t" x="138" y="48">H2C</text>
  <rect class="w" x="218" y="42" width="92" height="68" rx="5"/><text class="t" x="252" y="34">A2L</text>
  <rect class="u" fill="#d7f75b" x="24" y="84" width="44" height="18" rx="3"/>
  <path d="M82 92 h24 M194 84 h18" stroke="#d7f75b" stroke-width="1.5" stroke-dasharray="3 4"/>
</svg>
