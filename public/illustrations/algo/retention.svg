<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" role="img" aria-label="Summarise then delete: each expired day becomes a summary row before its orders, jobs and batches are removed">
  <style>
    .t { font: 500 10px ui-monospace, Menlo, monospace; fill: #fff; fill-opacity: .7 }
    .k { font: 600 10px ui-monospace, Menlo, monospace; fill: #0e1116 }
    .d { animation: f 6s ease-in-out infinite } .d2 { animation-delay: .3s } .d3 { animation-delay: .6s }
    .sum { animation: s 6s ease-in-out infinite }
    @keyframes f { 0%, 30% { opacity: 1 } 55%, 100% { opacity: .1 } }
    @keyframes s { 0%, 40% { opacity: 0 } 60%, 100% { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { .d, .sum { animation: none } }
  </style>
  <rect class="d" fill="#2d8af7" x="20" y="24" width="26" height="26" rx="5"/>
  <rect class="d d2" fill="#2d8af7" x="52" y="24" width="26" height="26" rx="5"/>
  <rect class="d d3" fill="#2d8af7" x="84" y="24" width="26" height="26" rx="5"/>
  <text class="t" x="20" y="70">days older than 30</text>
  <path d="M124 37 H170" stroke="#d7f75b" stroke-width="1.5" stroke-dasharray="3 5"/>
  <g class="sum">
    <rect fill="#d7f75b" x="178" y="20" width="128" height="34" rx="8"/>
    <text class="k" x="190" y="41">one summary per day</text>
  </g>
  <text class="t" x="20" y="102">counted first, deleted after</text>
</svg>
