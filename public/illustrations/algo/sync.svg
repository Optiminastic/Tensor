<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" role="img" aria-label="Incremental sync: each pull asks only for orders updated since the last one, with a small overlap so nothing is missed">
  <style>
    .t { font: 500 10px ui-monospace, Menlo, monospace; fill: #fff; fill-opacity: .7 }
    .k { animation: k 4s linear infinite }
    @keyframes k { from { transform: translateX(0) } to { transform: translateX(190px) } }
    @media (prefers-reduced-motion: reduce) { .k { animation: none } }
  </style>
  <line x1="20" y1="60" x2="300" y2="60" stroke="#fff" stroke-opacity=".3" stroke-width="2"/>
  <rect fill="#2d8af7" fill-opacity=".8" x="40" y="50" width="70" height="20" rx="4"/>
  <rect fill="#2d8af7" fill-opacity=".8" x="100" y="50" width="70" height="20" rx="4"/>
  <rect fill="#2d8af7" fill-opacity=".8" x="160" y="50" width="70" height="20" rx="4"/>
  <rect fill="#d7f75b" x="100" y="50" width="10" height="20"/>
  <rect fill="#d7f75b" x="160" y="50" width="10" height="20"/>
  <circle class="k" fill="#fff" cx="40" cy="60" r="4"/>
  <text class="t" x="40" y="38">a pull every minute</text>
  <text class="t" x="40" y="92">lime: the overlap between pulls</text>
  <text class="t" x="40" y="108">a failed pull falls back to two days</text>
</svg>
