<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" role="img" aria-label="A design sliced into layers, measured in grams and minutes, and priced on the price ladder">
  <style>
    .layer { fill: #2d8af7; transform-box: fill-box; transform-origin: left; animation: lay 6s ease-out infinite; }
    .l2 { animation-delay: .25s } .l3 { animation-delay: .5s } .l4 { animation-delay: .75s }
    .l5 { animation-delay: 1s } .l6 { animation-delay: 1.25s } .l7 { animation-delay: 1.5s }
    .rung { fill: #fff; stroke: #0e1116; stroke-opacity: .15; }
    .price { fill: #d7f75b; stroke: #0e1116; stroke-width: 2; animation: pick 6s ease-out infinite; }
    .pick { animation: pick 6s ease-out infinite; }
    .tag { font: 600 15px system-ui, sans-serif; fill: #0e1116; }
    .meta { font: 500 13px ui-monospace, Menlo, monospace; fill: #0e1116; fill-opacity: .7; }
    .flow { stroke: #0e1116; stroke-opacity: .35; stroke-width: 2; stroke-dasharray: 3 7; fill: none; animation: dash 1.4s linear infinite; }
    @keyframes lay { 0% { transform: scaleX(0) } 18%, 85% { transform: scaleX(1) } 100% { transform: scaleX(1) } }
    @keyframes pick { 0%, 35% { opacity: 0 } 50%, 92% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes dash { to { stroke-dashoffset: -20 } }
    @media (prefers-reduced-motion: reduce) { .layer, .price, .pick, .flow { animation: none } }
  </style>

  <!-- the sliced design, as print layers -->
  <g transform="translate(40 120)">
    <rect class="layer l7" x="40" y="0" width="60" height="16" rx="3"/>
    <rect class="layer l6" x="28" y="20" width="84" height="16" rx="3"/>
    <rect class="layer l5" x="18" y="40" width="104" height="16" rx="3"/>
    <rect class="layer l4" x="10" y="60" width="120" height="16" rx="3"/>
    <rect class="layer l3" x="10" y="80" width="120" height="16" rx="3"/>
    <rect class="layer l2" x="4" y="100" width="132" height="16" rx="3"/>
    <rect class="layer" x="0" y="120" width="140" height="16" rx="3"/>
    <rect x="-12" y="142" width="164" height="8" rx="4" fill="#0e1116"/>
  </g>
  <text class="meta" x="40" y="310">42.6 g · 3 h 18 min</text>

  <path class="flow" d="M200 200 C 240 200, 250 170, 290 170"/>

  <!-- the price ladder -->
  <g transform="translate(300 60)">
    <rect class="rung" x="0" y="0" width="180" height="40" rx="10"/>
    <text class="tag" x="16" y="26">₹1,499</text>
    <rect class="rung" x="0" y="52" width="180" height="40" rx="10"/>
    <rect class="price" x="0" y="52" width="180" height="40" rx="10"/>
    <text class="tag" x="16" y="78">₹1,299</text>
    <path class="pick" d="M146 72 l8 8 l14 -16" fill="none" stroke="#0e1116" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect class="rung" x="0" y="104" width="180" height="40" rx="10"/>
    <text class="tag" x="16" y="130">₹999</text>
    <rect class="rung" x="0" y="156" width="180" height="40" rx="10"/>
    <text class="tag" x="16" y="182">₹749</text>
    
    <text class="meta" x="0" y="282">snapped up to ₹1,299</text>
    <circle cx="10" cy="302" r="6" fill="#7a9c00"/>
    <text class="meta" x="24" y="307">cost 23% of price</text>
  </g>
</svg>
