<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" role="img" aria-label="An order moving through Tensor: order, job, 3D model, print bed, printer, parcel">
  <style>
    .track { stroke: #0e1116; stroke-opacity: .18; stroke-width: 3; stroke-dasharray: 2 10; stroke-linecap: round; }
    .done { stroke: #2d8af7; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: fill 9s linear infinite; }
    .node { fill: #fff; stroke: #0e1116; stroke-opacity: .25; stroke-width: 2; animation: lit 9s ease-out infinite; }
    .ic { fill: none; stroke: #0e1116; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .token { fill: #d7f75b; stroke: #0e1116; stroke-width: 2.5; offset-path: path('M100 110 H1100'); animation: travel 9s linear infinite; }
    .s1 { animation-delay: 0s } .s2 { animation-delay: 1.8s } .s3 { animation-delay: 3.6s }
    .s4 { animation-delay: 5.4s } .s5 { animation-delay: 7.2s } .s6 { animation-delay: 9s }
    @keyframes travel { 0% { offset-distance: 0% } 100% { offset-distance: 100% } }
    @keyframes fill { 0% { stroke-dashoffset: 1000 } 100% { stroke-dashoffset: 0 } }
    @keyframes lit {
      0% { stroke: #2d8af7; stroke-opacity: 1; stroke-width: 5; }
      12% { stroke: #2d8af7; stroke-opacity: 1; stroke-width: 3; }
      30%, 100% { stroke: #0e1116; stroke-opacity: .25; stroke-width: 2; }
    }
    @media (prefers-reduced-motion: reduce) {
      .token, .done, .node { animation: none; }
      .token { offset-distance: 50%; }
      .done { stroke-dashoffset: 500; }
    }
  </style>

  <line class="track" x1="100" y1="110" x2="1100" y2="110"/>
  <path class="done" d="M100 110 H1100"/>

  <!-- order -->
  <circle class="node s1" cx="100" cy="110" r="46"/>
  <g class="ic" transform="translate(100 110)">
    <path d="M-15 -8 h30 l-3 24 h-24 z"/><path d="M-7 -8 v-5 a7 7 0 0 1 14 0 v5"/>
  </g>
  <!-- job ticket -->
  <circle class="node s2" cx="300" cy="110" r="46"/>
  <g class="ic" transform="translate(300 110)">
    <rect x="-14" y="-18" width="28" height="36" rx="4"/><path d="M-7 -8 h14 M-7 0 h14 M-7 8 h8"/>
  </g>
  <!-- 3D model -->
  <circle class="node s3" cx="500" cy="110" r="46"/>
  <g class="ic" transform="translate(500 110)">
    <path d="M0 -18 L17 -8 V10 L0 20 L-17 10 V-8 Z"/><path d="M-17 -8 L0 2 L17 -8 M0 2 V20"/>
  </g>
  <!-- print bed -->
  <circle class="node s4" cx="700" cy="110" r="46"/>
  <g class="ic" transform="translate(700 110)">
    <rect x="-18" y="-18" width="36" height="36" rx="3"/>
    <rect x="-12" y="-12" width="10" height="14" rx="1.5" fill="#2d8af7" stroke="none"/>
    <rect x="1" y="-12" width="11" height="9" rx="1.5" fill="#d7f75b" stroke="#0e1116" stroke-width="1.6"/>
    <rect x="1" y="0" width="11" height="12" rx="1.5" fill="#0e1116" stroke="none"/>
  </g>
  <!-- printer -->
  <circle class="node s5" cx="900" cy="110" r="46"/>
  <g class="ic" transform="translate(900 110)">
    <rect x="-18" y="-18" width="36" height="36" rx="4"/><path d="M-18 -6 h36"/><path d="M-4 -6 v6 l4 4 l4 -4 v-6"/><path d="M-10 12 h20"/>
  </g>
  <!-- parcel -->
  <circle class="node s6" cx="1100" cy="110" r="46"/>
  <g class="ic" transform="translate(1100 110)">
    <path d="M-17 -6 L0 -15 L17 -6 V12 L0 20 L-17 12 Z"/><path d="M-17 -6 L0 3 L17 -6 M0 3 V20"/><path d="M-8 -10.5 L8 -2" />
  </g>

  <circle class="token" r="13"/>
</svg>
