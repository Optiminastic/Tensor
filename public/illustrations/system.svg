<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-label="Tensor's system: the web app calls the Go API; the API and four workers share one PostgreSQL database that holds the data and the work queues; the workers talk to the print farm, storage and outside services">
  <style>
    .box { fill: #fff; stroke: #0e1116; stroke-opacity: .15; stroke-width: 1.5; }
    .core { fill: #0e1116; }
    .db { fill: #2d8af7; }
    .t { font: 600 16px system-ui, sans-serif; fill: #0e1116; }
    .tw { font: 600 16px system-ui, sans-serif; fill: #fff; }
    .m { font: 500 12px system-ui, sans-serif; fill: #0e1116; fill-opacity: .65; }
    .mw { font: 500 12px system-ui, sans-serif; fill: #fff; fill-opacity: .8; }
    .wire { fill: none; stroke: #0e1116; stroke-opacity: .35; stroke-width: 2; stroke-dasharray: 4 8; stroke-linecap: round; animation: flow 1.6s linear infinite; }
    .hot { stroke: #2d8af7; stroke-opacity: 1; }
    .rev { animation-direction: reverse; }
    .job { fill: #d7f75b; stroke: #0e1116; stroke-width: 1.5; animation: queue 3s ease-in-out infinite; }
    .q2 { animation-delay: 1s } .q3 { animation-delay: 2s }
    @keyframes flow { to { stroke-dashoffset: -24 } }
    @keyframes queue { 0% { transform: translateX(0); opacity: 0 } 15% { opacity: 1 } 85% { opacity: 1 } 100% { transform: translateX(96px); opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .wire, .job { animation: none } .job { opacity: 1 } }
  </style>

  <!-- wires -->
  <path class="wire hot" d="M260 90 H400"/>
  <path class="wire hot rev" d="M500 130 V220"/>
  <path class="wire" d="M380 280 H250"/><path class="wire" d="M380 300 C 300 300, 300 380, 250 380"/>
  <path class="wire rev" d="M620 280 H750"/><path class="wire rev" d="M620 300 C 700 300, 700 380, 750 380"/>
  <path class="wire" d="M150 420 V470"/><path class="wire" d="M850 420 V470"/>
  <path class="wire" d="M600 90 H740"/>

  <!-- web app -->
  <rect class="box" x="40" y="50" width="220" height="80" rx="20"/>
  <text class="t" x="64" y="86">Web app</text><text class="m" x="64" y="108">Next.js · signs people in</text>

  <!-- API -->
  <rect class="core" x="400" y="50" width="200" height="80" rx="20"/>
  <text class="tw" x="424" y="86">Tensor-Core API</text><text class="mw" x="424" y="108">Go · owns every rule</text>

  <!-- Shopify -->
  <rect class="box" x="740" y="50" width="220" height="80" rx="20"/>
  <text class="t" x="764" y="86">Shopify</text><text class="m" x="764" y="108">orders in, products out</text>

  <!-- database and queues -->
  <rect class="db" x="380" y="220" width="240" height="120" rx="22"/>
  <text class="tw" x="404" y="256">PostgreSQL</text><text class="mw" x="404" y="278">the data and the work queues</text>
  <rect x="404" y="298" width="192" height="24" rx="12" fill="#fff" fill-opacity=".2"/>
  <rect class="job" x="410" y="303" width="22" height="14" rx="4"/>
  <rect class="job q2" x="410" y="303" width="22" height="14" rx="4"/>
  <rect class="job q3" x="410" y="303" width="22" height="14" rx="4"/>

  <!-- workers -->
  <rect class="box" x="40" y="250" width="210" height="64" rx="18"/>
  <text class="t" x="62" y="278">Production worker</text><text class="m" x="62" y="298">jobs and 3D models</text>
  <rect class="box" x="40" y="350" width="210" height="64" rx="18"/>
  <text class="t" x="62" y="378">Slice worker</text><text class="m" x="62" y="398">Bambu Studio, headless</text>
  <rect class="box" x="750" y="250" width="210" height="64" rx="18"/>
  <text class="t" x="772" y="278">Batch worker</text><text class="m" x="772" y="298">beds, printers, dispatch</text>
  <rect class="box" x="750" y="350" width="210" height="64" rx="18"/>
  <text class="t" x="772" y="378">Agent workers</text><text class="m" x="772" y="398">calls, retention, reports</text>

  <!-- outside -->
  <rect class="box" x="40" y="470" width="220" height="60" rx="18"/>
  <text class="t" x="62" y="497">S3 storage</text><text class="m" x="62" y="516">designs, models, plates</text>
  <rect class="box" x="740" y="470" width="220" height="60" rx="18"/>
  <text class="t" x="762" y="497">BambuBuddy → printers</text><text class="m" x="762" y="516">queue, status, camera</text>
  <rect class="box" x="390" y="440" width="220" height="90" rx="18"/>
  <text class="t" x="412" y="472">Customers</text><text class="m" x="412" y="494">WhatsApp · Sarvam voice</text><text class="m" x="412" y="512">Delhivery shipping</text>
  <path class="wire" d="M500 340 V440"/>
</svg>
